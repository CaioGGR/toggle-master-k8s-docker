# ==============================================================================
# MICROSSERVIÇOS DA APLICAÇÃO (DEPLOYMENTS E SERVICES)
# ==============================================================================
# Este arquivo contém a declaração de Deployments (para gerenciar os Pods)
# e Services (tipo ClusterIP, para comunicação interna na rede do Kubernetes).
#
# REGRA GERAL APLICADA:
# - envFrom: Puxa todas as variáveis do ConfigMap (app-config) e Secret (app-secrets).
# - Resources: Limita CPU e Memória para evitar que um serviço derrube o Node inteiro.
# - Probes: Verifica a rota /health para saber se o container está vivo e pronto.
# - Imagens: Contêm um PLACEHOLDER para o AWS ECR que deve ser substituído.

# ==============================================================================
# 1. AUTH SERVICE
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: toggle-master
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          # Substitua 'SEU_ID_CONTA' pelo ID real da sua conta AWS (ex: 352911112942)
          image: 804297579874.dkr.ecr.us-east-1.amazonaws.com/togglemaster-auth:bf95d3627df0c87431519ee1c236d364f7582547
          ports:
            - containerPort: 8001
          # Injeta todas as configurações e segredos de uma vez!
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          # O código espera a variável "DATABASE_URL" exata, então fazemos o mapeamento
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_AUTH_URL
          # Limites de processamento para evitar gargalos (OOMKilled)
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          # Liveness: Reinicia o container se ele travar
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 10
          # Readiness: Só envia tráfego se a aplicação já iniciou de verdade
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: toggle-master
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001

---
