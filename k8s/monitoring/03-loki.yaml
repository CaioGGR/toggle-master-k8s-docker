# ==============================================================================
# GRAFANA LOKI (AGREGADOR E CENTRALIZADOR DE LOGS)
# ==============================================================================
# O Loki é o "Prometheus para Logs". Em vez de indexar o texto inteiro de cada
# linha de log (como faz o Elasticsearch, que consome muita memória RAM), o Loki
# indexa apenas os metadados/labels (ex: nome do serviço, nível de erro) e
# comprime o texto bruto, tornando-o super leve para rodar no cluster.

# ------------------------------------------------------------------------------
# 1. CONFIGMAP (Configuração interna do Loki)
# ------------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki.yaml: |
    # Desativa exigência de autenticação multi-tenant (ideal para uso interno no cluster)
    auth_enabled: false

    server:
      http_listen_port: 3100 # Porta onde o Loki recebe logs do OTel e consultas do Grafana

    common:
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory # Coordenação em memória (suficiente para 1 réplica)
      replication_factor: 1
      path_prefix: /tmp/loki # Pasta temporária onde os dados do Loki ficarão no container

    # Define como os índices dos logs são estruturados
    schema_config:
      configs:
        - from: 2020-05-15
          store: boltdb-shipper # Salva o índice localmente sem precisar de banco externo
          object_store: filesystem # Salva os blocos de log no disco local do container
          schema: v11
          index:
            prefix: index_
            period: 24h

    # Diretório onde os blocos (chunks) de logs comprimidos serão gravados
    storage_config:
      filesystem:
        directory: /tmp/loki/chunks
---
# ------------------------------------------------------------------------------
# 2. DEPLOYMENT (Servidor do Loki)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.2
          args:
            # Aponta para o arquivo de configuração montado pelo ConfigMap
            - "-config.file=/etc/loki/loki.yaml"
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: config-volume
              mountPath: /etc/loki
      volumes:
        - name: config-volume
          configMap:
            name: loki-config
---
# ------------------------------------------------------------------------------
# 3. SERVICE (Exposição interna para o OTel Collector e Grafana)
# ------------------------------------------------------------------------------
# Endereço no cluster: http://loki.monitoring.svc.cluster.local:3100
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
spec:
  selector:
    app: loki
  ports:
    - port: 3100
      targetPort: 3100
