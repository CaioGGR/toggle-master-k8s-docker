# ==============================================================================
# SELF-HEALING WEBHOOK RECEIVER (AUTO-REMEDIAÇÃO NO KUBERNETES)
# ==============================================================================
# Este componente recebe notificações de alerta via Webhook enviadas pelo
# Grafana e executa automaticamente um 'rollout restart' nos microsserviços
# afetados no namespace 'toggle-master' usando a API interna do Kubernetes.

# ------------------------------------------------------------------------------
# 1. SERVICE ACCOUNT E PERMISSÕES (RBAC)
# ------------------------------------------------------------------------------
# Cria uma identidade para o pod e concede permissão para listar e atualizar
# (patch) Deployments em outros namespaces (ex: toggle-master).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: self-healing-sa
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: self-healing-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: self-healing-binding
subjects:
  - kind: ServiceAccount
    name: self-healing-sa
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: self-healing-role
  apiGroup: rbac.authorization.k8s.io
---
# ------------------------------------------------------------------------------
# 2. CONFIGMAP (Script Python do Servidor Webhook)
# ------------------------------------------------------------------------------
# Usa apenas bibliotecas nativas do Python (sem precisar de pip install ou nc).
# Lê o JSON enviado pelo Grafana, verifica se o alerta está ativo ('firing') e
# chama a API do Kubernetes para reiniciar os Deployments no namespace correto.
apiVersion: v1
kind: ConfigMap
metadata:
  name: self-healing-script
  namespace: monitoring
data:
  webhook.py: |
    import json
    import ssl
    import urllib.request
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, HTTPServer

    TARGET_NAMESPACE = "toggle-master"
    TARGET_DEPLOYMENTS = ["evaluation-service", "flag-service"]
    SA_TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    SA_CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

    def restart_deployment(deployment_name):
        with open(SA_TOKEN_PATH, "r") as f:
            token = f.read().strip()

        url = f"https://kubernetes.default.svc/apis/apps/v1/namespaces/{TARGET_NAMESPACE}/deployments/{deployment_name}"
        payload = json.dumps({
            "spec": {
                "template": {
                    "metadata": {
                        "annotations": {
                            "kubectl.kubernetes.io/restartedAt": datetime.now(timezone.utc).isoformat()
                        }
                    }
                }
            }
        }).encode("utf-8")

        req = urllib.request.Request(
            url,
            data=payload,
            method="PATCH",
            headers={
                "Authorization": f"Bearer {token}",
                "Content-Type": "application/strategic-merge-patch+json",
            },
        )
        ctx = ssl.create_default_context(cafile=SA_CA_PATH)
        with urllib.request.urlopen(req, context=ctx, timeout=10) as resp:
            print(f"[REMEDIACAO CONCLUIDA] {deployment_name} reiniciado (HTTP {resp.status}).", flush=True)

    class WebhookHandler(BaseHTTPRequestHandler):
        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            body = self.rfile.read(length).decode("utf-8") if length > 0 else "{}"

            try:
                data = json.loads(body)
            except json.JSONDecodeError:
                data = {}

            status = data.get("status", "")
            print(f"[WEBHOOK RECEBIDO] status={status!r}", flush=True)

            if status == "firing":
                print("[ALERTA FIRING] Executando auto-remediacao no namespace toggle-master...", flush=True)
                for deploy in TARGET_DEPLOYMENTS:
                    try:
                        restart_deployment(deploy)
                    except Exception as exc:
                        print(f"[ERRO] Falha ao reiniciar {deploy}: {exc}", flush=True)
            else:
                print("[IGNORADO] Alerta não está em estado 'firing' (ex: resolved). Nenhum restart necessário.", flush=True)

            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(b"OK")

        def do_GET(self):
            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"Self-Healing Receiver is healthy")

    if __name__ == "__main__":
        print("Self-Healing Webhook Server iniciado na porta 8080...", flush=True)
        HTTPServer(("0.0.0.0", 8080), WebhookHandler).serve_forever()
---
# ------------------------------------------------------------------------------
# 3. DEPLOYMENT (Container do Receptor de Self-Healing)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-healing-receiver
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: self-healing-receiver
  template:
    metadata:
      labels:
        app: self-healing-receiver
    spec:
      serviceAccountName: self-healing-sa
      containers:
        - name: receiver
          image: python:3.11-alpine
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
          command: ["python", "/app/webhook.py"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: script-volume
              mountPath: /app
      volumes:
        - name: script-volume
          configMap:
            name: self-healing-script
---
# ------------------------------------------------------------------------------
# 4. SERVICE (Endereço interno para o Grafana enviar o Webhook)
# ------------------------------------------------------------------------------
# No Contact Point do Grafana (tipo Webhook), use a URL:
# http://self-healing-service.monitoring.svc.cluster.local:8080
apiVersion: v1
kind: Service
metadata:
  name: self-healing-service
  namespace: monitoring
spec:
  selector:
    app: self-healing-receiver
  ports:
    - port: 8080
      targetPort: 8080
