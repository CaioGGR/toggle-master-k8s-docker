# ==============================================================================
# GRAFANA (PAINEL DE VISUALIZAÇÃO DE MÉTRICAS E LOGS)
# ==============================================================================
# O Grafana é a interface visual onde criamos Dashboards e exploramos tanto as
# métricas (vindas do Prometheus) quanto os logs (vindos do Loki) em uma única tela.

# ------------------------------------------------------------------------------
# 1. CONFIGMAP (Provisionamento Automático de Datasources)
# ------------------------------------------------------------------------------
# Ao montar este arquivo na pasta '/etc/grafana/provisioning/datasources',
# o Grafana já nasce conectado ao Prometheus e ao Loki automaticamente, sem
# precisarmos cadastrar as URLs manualmente na interface web!
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  prometheus-loki.yaml: |
    apiVersion: 1
    datasources:
      # Conecta o Grafana ao serviço interno do Prometheus (Fonte padrão)
      - name: Prometheus
        type: prometheus
        uid: PBFA97CFB590B2093 # UID fixo para manter o vínculo automático com os Dashboards provisionados
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
      # Conecta o Grafana ao serviço interno do Loki para leitura de logs
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
---
# ------------------------------------------------------------------------------
# 2. CONFIGMAP (Provedor de Dashboards como Código - Dashboard as Code)
# ------------------------------------------------------------------------------
# Este arquivo avisa ao Grafana para monitorar a pasta '/var/lib/grafana/dashboards'
# e carregar automaticamente qualquer arquivo .json que estiver lá dentro.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'ToggleMaster Dashboards'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
# ------------------------------------------------------------------------------
# 3. CONFIGMAP (JSON do Dashboard do ToggleMaster - Fase 4)
# ------------------------------------------------------------------------------
# Aqui fica salvo o código JSON do nosso painel. Dessa forma, mesmo destruindo
# o cluster inteiro com 'terraform destroy', o painel já nasce pronto no próximo 'apply'!
