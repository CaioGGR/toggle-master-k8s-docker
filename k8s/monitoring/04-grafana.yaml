---
# ------------------------------------------------------------------------------
# 4. DEPLOYMENT (Servidor Web do Grafana)
# ------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.2.0
          ports:
            - containerPort: 3000 # Porta padrão da interface web do Grafana
          env:
            # Define a senha inicial do usuário 'admin' (Login: admin / Senha: admin)
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
          volumeMounts:
            # Injeta o arquivo de datasources na pasta de provisionamento automático
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            # Injeta a configuração do provedor de dashboards automáticos
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
            # Injeta o arquivo JSON do nosso painel dentro do Grafana
            - name: dashboard-togglemaster
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboard-togglemaster
          configMap:
            name: grafana-dashboard-togglemaster
---
# ------------------------------------------------------------------------------
# 5. SERVICE (Acesso ao Grafana)
# ------------------------------------------------------------------------------
# Como é do tipo ClusterIP, para acessar pelo navegador na sua máquina basta rodar:
# kubectl port-forward svc/grafana -n monitoring 3000:3000
# E abrir: http://localhost:3000
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
