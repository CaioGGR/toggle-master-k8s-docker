# ==============================================================================
# 1. NAMESPACE
# ==============================================================================
# O Namespace atua como um isolamento lógico para todos os recursos da aplicação.
# Separar a aplicação em um namespace próprio (toggle-master) é uma melhor prática
# de segurança e organização no Kubernetes, evitando conflitos com outros projetos.
apiVersion: v1
kind: Namespace
metadata:
  name: toggle-master
  labels:
    name: toggle-master
    environment: production

---
# ==============================================================================
# 2. CONFIGMAP
# ==============================================================================
# O ConfigMap armazena variáveis de ambiente não sensíveis.
# Aqui definimos as URLs internas seguindo o padrão DNS do Kubernetes:
# <nome-do-servico>.<namespace>.svc.cluster.local:<porta>
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: toggle-master
data:
  # URLs de comunicação interna entre os microsserviços
  AUTH_SERVICE_URL: "http://auth-service.toggle-master.svc.cluster.local:8001"
  FLAG_SERVICE_URL: "http://flag-service.toggle-master.svc.cluster.local:8002"
  TARGETING_SERVICE_URL: "http://targeting-service.toggle-master.svc.cluster.local:8003"
  EVALUATION_SERVICE_URL: "http://evaluation-service.toggle-master.svc.cluster.local:8004"
  ANALYTICS_SERVICE_URL: "http://analytics-service.toggle-master.svc.cluster.local:8005"

  # Configurações AWS não sensíveis
  AWS_REGION: "us-east-1"
  AWS_DYNAMODB_TABLE: "ToggleMasterAnalytics"
  AWS_SQS_URL: "https://sqs.us-east-1.amazonaws.com/804297579874/togglemaster-events-queue-dev"
