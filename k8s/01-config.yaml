# ==============================================================================
# 1. NAMESPACE
# ==============================================================================
# O Namespace atua como um isolamento lógico para todos os recursos da aplicação.
# Separar a aplicação em um namespace próprio (toggle-master) é uma melhor prática
# de segurança e organização no Kubernetes, evitando conflitos com outros projetos.
apiVersion: v1
kind: Namespace
metadata:
  name: toggle-master
  labels:
    name: toggle-master
    environment: production

---
# ==============================================================================
# 2. CONFIGMAP
# ==============================================================================
# O ConfigMap armazena variáveis de ambiente não sensíveis.
# Aqui definimos as URLs internas seguindo o padrão DNS do Kubernetes:
# <nome-do-servico>.<namespace>.svc.cluster.local:<porta>
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: toggle-master
data:
  # URLs de comunicação interna entre os microsserviços
  AUTH_SERVICE_URL: "http://auth-service.toggle-master.svc.cluster.local:8001"
  FLAG_SERVICE_URL: "http://flag-service.toggle-master.svc.cluster.local:8002"
  TARGETING_SERVICE_URL: "http://targeting-service.toggle-master.svc.cluster.local:8003"
  EVALUATION_SERVICE_URL: "http://evaluation-service.toggle-master.svc.cluster.local:8004"
  ANALYTICS_SERVICE_URL: "http://analytics-service.toggle-master.svc.cluster.local:8005"

  # Configurações AWS não sensíveis
  AWS_REGION: "us-east-1"
  AWS_DYNAMODB_TABLE: "ToggleMasterAnalytics"
  AWS_SQS_URL: "https://sqs.us-east-1.amazonaws.com/352911112942/toggle-master-queue"

---
# ==============================================================================
# 3. SECRET
# ==============================================================================
# O Secret armazena informações sensíveis. Todos os valores na seção 'data'
# DEVEM obrigatoriamente estar encodados em Base64.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: toggle-master
type: Opaque
data:
  # --- Credenciais da AWS ---
  # AWS_ACCESS_KEY_ID (ex: QUtJQVBMQUNFSE9MREVSCg==)
  AWS_ACCESS_KEY_ID: "="

  # AWS_SECRET_ACCESS_KEY (ex: U2VjcmV0QWNjZXNzS2V5UGxhY2Vob2xkZXIK)
  AWS_SECRET_ACCESS_KEY: "=="

  # AWS_SESSION_TOKEN (ex: U2Vzc2lvblRva2VuUGxhY2Vob2xkZXIK)
  AWS_SESSION_TOKEN: ""

  # --- Bancos de Dados PostgreSQL ---
  # DB_AUTH_URL (postgresql://user:pass@db-auth:5432/db com ssl require)
  DB_AUTH_URL: "=="

  # DB_FLAG_URL (postgresql://user:pass@db-flag:5432/db com ssl require)
  DB_FLAG_URL: "="

  # DB_TARGETING_URL (postgresql://user:pass@db-targeting:5432/db com ssl require)
  DB_TARGETING_URL: "="

  # --- Cache (Redis ElastiCache) ---
  # REDIS_URL (redis://elasticache-redis.example.com:6379)
  REDIS_URL: "=="

  # --- Segurança da Aplicação ---
  # MASTER_KEY
  MASTER_KEY: "="

  # SERVICE_API_KEY (usado pelo evaluation-service)
  SERVICE_API_KEY: "="
